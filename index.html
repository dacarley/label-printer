<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Label Print (Vanilla)</title>

  <style>
    :root{
      --bg:#0b0c10;
      --fg:#e8e8e8;
      --muted:#a7a7a7;
      --card:#14161d;
      --border:rgba(255,255,255,0.12);

      /* label settings (inches) */
      --label-w-in: 4;
      --label-h-in: 6;
      --padding-in: 0.2;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      background:var(--bg);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      line-height:1.35;
    }

    .app{
      max-width:1100px;
      margin:0 auto;
      padding:16px;
      display:grid;
      gap:14px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px){
      .app{ grid-template-columns: 1.15fr 0.85fr; }
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
      min-width:0;
    }

    h1{
      font-size:16px;
      margin:0 0 10px 0;
      font-weight:650;
      letter-spacing:0.2px;
    }

    .row{ display:grid; gap:10px; margin-bottom:10px; }

    .row.controls{ grid-template-columns: 1fr; }
    @media (min-width: 520px){
      .row.controls{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (min-width: 900px){
      .row.controls{ grid-template-columns: repeat(3, minmax(0,1fr)); }
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }

    input[type="number"], select, textarea, button{
      width:100%;
      border-radius:10px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.04);
      color:var(--fg);
      padding:10px 10px;
      font-size:14px;
      outline:none;
    }

    /* Default textarea sizing (wide layouts) */
    textarea{
      min-height: 38vh;
      max-height: 60vh;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      line-height:1.25;
      white-space: pre;
    }
    @media (min-width: 900px){
      textarea{ min-height: 260px; }
    }

    /* Stacked mode: smaller default + auto-grow/shrink (JS sets height), no manual resize */
    @media (max-width: 899px){
      textarea{
        min-height: 120px;
        max-height: 55vh;
        resize: none;
      }
    }

    .hint{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    .btnrow{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:8px;
    }

    button{
      cursor:pointer;
      background: rgba(122,162,255,0.18);
      border-color: rgba(122,162,255,0.45);
      font-weight:650;
      padding: 12px 12px;
    }
    button:hover{ background: rgba(122,162,255,0.26); }
    button:active{ transform: translateY(1px); }

    .secondary{
      background: rgba(255,255,255,0.06);
      border-color: var(--border);
      font-weight:600;
    }

    .status{
      margin-left:auto;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }

    .previewOuter{
      display:grid;
      place-items:center;
      padding:12px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius:14px;
      overflow:auto;
    }

    /* Preview label */
    .label{
      background:#fff;
      color:#000;
      box-shadow:0 10px 26px rgba(0,0,0,0.35);
      position:relative;
      border-radius:12px;

      width: min(100%, calc(var(--label-w-in) * 96px));
      aspect-ratio: calc(var(--label-w-in) / var(--label-h-in));
      height: auto;
    }
    @media (min-width: 520px){
      .label{
        width: calc(var(--label-w-in) * 96px);
        height: calc(var(--label-h-in) * 96px);
        aspect-ratio: auto;
      }
    }

    .labelInner{
      position:absolute;
      inset: calc(var(--padding-in) * 96px);
      border:1px solid rgba(0,0,0,0.10);
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:0;
    }

    .labelTextSpan{
      display:inline-block;
      font-weight:800;
      line-height:1.05;
      white-space: pre;
      overflow-wrap: normal;
      word-break: keep-all;
      hyphens: none;
      text-align:center;
      font-size: 32px; /* JS overrides */
    }

    .warn{
      color:#ff6b6b;
      font-size:12px;
      margin-top:8px;
    }

    /* ---- Print overlay ---- */
    #printOverlay{
      position:fixed;
      inset:0;
      background:#fff;
      display:none;        /* shown only during print flow */
      z-index: 999999;
    }

    #printOverlay .printLabel{
      width: calc(var(--label-w-in) * 1in);
      height: calc(var(--label-h-in) * 1in);
      margin:0;
      position:absolute;
      left:0;
      top:0;
      background:#fff;
      color:#000;
    }

    #printOverlay .printInner{
      position:absolute;
      inset: calc(var(--padding-in) * 1in);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:0;
    }

    #printOverlay .printSpan{
      display:inline-block;
      font-weight:800;
      line-height:1.05;
      white-space: pre;
      overflow-wrap: normal;
      word-break: keep-all;
      hyphens:none;
      text-align:center;
      font-size: 24pt; /* JS overrides */
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    /* Print: hide app, show overlay */
    @page { size: auto; margin: 0; }
    @media print{
      html,body{ margin:0 !important; padding:0 !important; background:#fff !important; }
      .app{ display:none !important; }
      #printOverlay{ display:block !important; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="panel">
      <h1>Label Printer</h1>

      <div class="row controls">
        <div>
          <label for="w">Label width (in)</label>
          <input id="w" type="number" min="0.5" step="0.01" value="4" inputmode="decimal" />
        </div>
        <div>
          <label for="h">Label height (in)</label>
          <input id="h" type="number" min="0.5" step="0.01" value="6" inputmode="decimal" />
        </div>
        <div>
          <label for="pad">Padding (in)</label>
          <input id="pad" type="number" min="0" step="0.01" value="0.20" inputmode="decimal" />
        </div>
        <div>
          <label for="orient">Orientation</label>
          <select id="orient">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div>
          <label for="align">Text align</label>
          <select id="align">
            <option value="center" selected>Center</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="printBtn">Print</button>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="txt">Label text (newlines are respected; wrapping is disabled)</label>
          <textarea id="txt" spellcheck="false" placeholder="Type your label text here...">Hello
Rollo</textarea>

          <div class="hint">
            macOS Safari print preview may still show Letter if Paper Size is set to 8.5×11. That’s a Safari print setting. Chrome/iOS should be correct.
          </div>

          <div id="overflowWarn" class="warn" style="display:none;">
            This text can’t fit even at the minimum font size. Shorten a line or increase label size.
          </div>
        </div>
      </div>

      <div class="btnrow">
        <button id="resetBtn" class="secondary" type="button">Reset to 4×6</button>
        <div class="status" id="status">Ready</div>
      </div>
    </div>

    <div class="panel">
      <h1>Preview</h1>
      <div class="previewOuter">
        <div class="label" id="previewLabel">
          <div class="labelInner" id="previewInner">
            <span class="labelTextSpan" id="previewSpan"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Print overlay (constructed/filled by JS, then torn down) -->
  <div id="printOverlay" aria-hidden="true"></div>

  <script>
    const els = {
      w: document.getElementById('w'),
      h: document.getElementById('h'),
      pad: document.getElementById('pad'),
      orient: document.getElementById('orient'),
      align: document.getElementById('align'),
      txt: document.getElementById('txt'),

      previewInner: document.getElementById('previewInner'),
      previewSpan: document.getElementById('previewSpan'),

      printBtn: document.getElementById('printBtn'),
      resetBtn: document.getElementById('resetBtn'),
      status: document.getElementById('status'),
      overflowWarn: document.getElementById('overflowWarn'),

      overlay: document.getElementById('printOverlay')
    };

    function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
    function normalizeText(raw){ return (raw ?? '').replace(/\r\n/g, '\n'); }

    function isStackedMode(){
      return window.matchMedia('(max-width: 899px)').matches;
    }

    function autosizeTextarea(){
      if (!isStackedMode()){
        els.txt.style.height = '';
        els.txt.style.overflowY = '';
        return;
      }
      els.txt.style.height = 'auto';
      const maxPx = Math.floor(window.innerHeight * 0.55);
      const target = Math.min(els.txt.scrollHeight + 2, maxPx);
      els.txt.style.height = target + 'px';
      els.txt.style.overflowY = (els.txt.scrollHeight + 2 > maxPx) ? 'auto' : 'hidden';
    }

    function setCSSVars(labelW, labelH, padIn){
      document.documentElement.style.setProperty('--label-w-in', String(labelW));
      document.documentElement.style.setProperty('--label-h-in', String(labelH));
      document.documentElement.style.setProperty('--padding-in', String(padIn));
    }

    function applyAlignment(alignment){
      const a = alignment;
      els.previewSpan.style.textAlign = a;
      const justify = (a === 'left') ? 'flex-start' : (a === 'right') ? 'flex-end' : 'center';
      els.previewInner.style.justifyContent = justify;

      const inset = (a === 'center') ? '0' : '0.10in';
      els.previewInner.style.paddingLeft  = (a === 'left')  ? inset : '0';
      els.previewInner.style.paddingRight = (a === 'right') ? inset : '0';
    }

    function measureSpanFits(spanEl, containerEl, fontPx){
      spanEl.style.fontSize = fontPx + 'px';
      const s = spanEl.getBoundingClientRect();
      const c = containerEl.getBoundingClientRect();
      return (s.width <= c.width) && (s.height <= c.height);
    }

    function bestFitFontPx(spanEl, containerEl){
      const MIN_PX = 6;
      const MAX_PX = 1200;

      let lo = MIN_PX, hi = MAX_PX, best = MIN_PX;
      while (lo <= hi){
        const mid = (lo + hi) >> 1;
        if (measureSpanFits(spanEl, containerEl, mid)){
          best = mid; lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      spanEl.style.fontSize = best + 'px';
      const minFits = measureSpanFits(spanEl, containerEl, MIN_PX);
      spanEl.style.fontSize = best + 'px';
      return { fontPx: best, minFits };
    }

    // Print overlay uses PT to behave better in print engines (esp. Safari)
    function measureSpanFitsPt(spanEl, containerEl, fontPt){
      spanEl.style.fontSize = fontPt + 'pt';
      const s = spanEl.getBoundingClientRect();
      const c = containerEl.getBoundingClientRect();
      return (s.width <= c.width) && (s.height <= c.height);
    }

    function bestFitFontPt(spanEl, containerEl){
      const MIN_PT = 4;
      const MAX_PT = 800;

      let lo = MIN_PT, hi = MAX_PT, best = MIN_PT;
      while (lo <= hi){
        const mid = Math.floor((lo + hi) / 2);
        if (measureSpanFitsPt(spanEl, containerEl, mid)){
          best = mid; lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      spanEl.style.fontSize = best + 'pt';
      const minFits = measureSpanFitsPt(spanEl, containerEl, MIN_PT);
      spanEl.style.fontSize = best + 'pt';
      return { fontPt: best, minFits };
    }

    function syncPreviewText(){
      const t = normalizeText(els.txt.value);
      els.previewSpan.textContent = t;
      return t;
    }

    function updateAll(){
      let w = parseFloat(els.w.value || '4');
      let h = parseFloat(els.h.value || '6');
      let pad = parseFloat(els.pad.value || '0.2');
      const orientation = els.orient.value;
      const align = els.align.value;

      w = clamp(isFinite(w) ? w : 4, 0.5, 20);
      h = clamp(isFinite(h) ? h : 6, 0.5, 30);
      pad = clamp(isFinite(pad) ? pad : 0.2, 0, Math.min(w,h)/2 - 0.01);

      const labelW = orientation === 'landscape' ? h : w;
      const labelH = orientation === 'landscape' ? w : h;

      setCSSVars(labelW, labelH, pad);
      applyAlignment(align);
      const text = syncPreviewText();

      const p = bestFitFontPx(els.previewSpan, els.previewInner);
      els.overflowWarn.style.display = p.minFits ? 'none' : 'block';
      els.status.textContent = p.minFits ? `Fit: ${Math.round(p.fontPx)}px` : `Text too large`;

      return { labelW, labelH, pad, align, text };
    }

    function buildPrintOverlay({ labelW, labelH, pad, align, text }){
      // Set vars so overlay uses correct inch sizing
      setCSSVars(labelW, labelH, pad);

      // Clear + build
      els.overlay.innerHTML = "";
      els.overlay.style.display = "block";
      els.overlay.setAttribute("aria-hidden", "false");

      const label = document.createElement("div");
      label.className = "printLabel";

      const inner = document.createElement("div");
      inner.className = "printInner";

      const span = document.createElement("span");
      span.className = "printSpan";
      span.textContent = text;

      // alignment
      span.style.textAlign = align;
      inner.style.justifyContent =
        (align === "left") ? "flex-start" :
        (align === "right") ? "flex-end" : "center";

      // small inset for left/right like preview
      inner.style.paddingLeft  = (align === "left")  ? "0.10in" : "0";
      inner.style.paddingRight = (align === "right") ? "0.10in" : "0";

      inner.appendChild(span);
      label.appendChild(inner);
      els.overlay.appendChild(label);

      return { inner, span };
    }

    function teardownPrintOverlay(){
      els.overlay.style.display = "none";
      els.overlay.setAttribute("aria-hidden", "true");
      els.overlay.innerHTML = "";
    }

    function nextPaint(){
      return new Promise(resolve => requestAnimationFrame(() => resolve()));
    }

    async function printNow(){
      autosizeTextarea();
      const snapshot = updateAll();

      // Build overlay and fit font AFTER it exists in DOM
      const { inner, span } = buildPrintOverlay(snapshot);

      // Wait for layout
      await nextPaint();
      await nextPaint();

      // Fit in PT (more stable for printing)
      bestFitFontPt(span, inner);

      // iOS likes a small delay before print
      const cleanup = () => teardownPrintOverlay();

      // afterprint is not 100% reliable on iOS, but works on desktop.
      window.addEventListener("afterprint", cleanup, { once: true });

      setTimeout(() => {
        window.print();
        // fallback cleanup in case afterprint doesn't fire
        setTimeout(cleanup, 1500);
      }, 60);
    }

    // Events
    [els.w, els.h, els.pad, els.orient, els.align].forEach(el => {
      el.addEventListener('input', () => { autosizeTextarea(); updateAll(); });
      el.addEventListener('change', () => { autosizeTextarea(); updateAll(); });
    });

    els.txt.addEventListener('input', () => {
      autosizeTextarea();
      updateAll();
    });

    window.addEventListener('resize', () => {
      clearTimeout(window.__labelResizeT);
      window.__labelResizeT = setTimeout(() => {
        autosizeTextarea();
        updateAll();
      }, 80);
    });

    els.printBtn.addEventListener('click', printNow);

    els.resetBtn.addEventListener('click', () => {
      els.w.value = '4';
      els.h.value = '6';
      els.pad.value = '0.20';
      els.orient.value = 'portrait';
      els.align.value = 'center';
      autosizeTextarea();
      updateAll();
    });

    // Init
    autosizeTextarea();
    updateAll();
  </script>
</body>
</html>
