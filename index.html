<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Label Print</title>
</head>

<body>
  <div class="app">
    <div class="panel">
      <h1>Label Printer</h1>
      <div class="row">
        <div>
          <textarea id="txt" placeholder="Type your label text here..." spellcheck="false"></textarea>
          <input id="orient" type="hidden" value="portrait" />
          <div class="warn" id="overflowWarn" style="display:none;">
            This text can't fit even at the minimum font size. Shorten a line or increase label size.
          </div>
        </div>
      </div>
      
      <div class="row">
        <div aria-label="Orientation" class="seg" role="group">
          <button aria-pressed="true" class="segBtn" id="portraitBtn" type="button">Portrait</button>
          <button aria-pressed="false" class="segBtn" id="landscapeBtn" type="button">Landscape</button>
        </div>
      </div>

      <div class="row mainBtns">
        <button class="secondary" id="sizeBtn" type="button">Label size…</button>
        <button class="primary inlinePrimary" id="printBtn" type="button">Print</button>
      </div>

      <!-- Size modal -->
      <div aria-hidden="true" class="modalBackdrop" id="sizeModal">
        <div aria-labelledby="sizeModalTitle" aria-modal="true" class="modal" role="dialog">
          <div class="modalHeader">
            <div class="modalTitle" id="sizeModalTitle">Label size</div>
          </div>
          <div class="presetBtns">
            <button class="secondary presetBtn" data-h="6" data-pad="0.20" data-w="4" type="button">4×6</button>
            <button class="secondary presetBtn" data-h="1" data-pad="0.10" data-w="2" type="button">2×1</button>
          </div>
          <div class="row controls modalControls">
            <div>
              <label for="w">Width (in)</label>
              <input id="w" inputmode="decimal" min="0.5" step="0.01" type="number" value="4" />
            </div>
            <div>
              <label for="h">Height (in)</label>
              <input id="h" inputmode="decimal" min="0.5" step="0.01" type="number" value="6" />
            </div>
            <div>
              <label for="pad">Padding (in)</label>
              <input id="pad" inputmode="decimal" min="0" step="0.01" type="number" value="0.20" />
            </div>
          </div>
          <div class="modalFooter">
            <button class="secondary" id="cancelModalBtn" type="button">Cancel</button>
            <button class="primary" id="okModalBtn" type="button">OK</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h1>Preview</h1>
      <div class="previewOuter">
        <div class="label" id="previewLabel">
          <div class="labelInner" id="previewInner">
            <div class="previewRotator" id="previewRotator">
              <span class="labelTextSpan" id="previewSpan"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div aria-hidden="true" id="printOverlay"></div>
  <div aria-hidden="true" id="printRoot"></div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
