<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Label Print (Vanilla)</title>

  <style>
    :root{
      --bg:#0b0c10;
      --fg:#e8e8e8;
      --muted:#a7a7a7;
      --card:#14161d;
      --border:rgba(255,255,255,0.12);

      /* label settings (inches) */
      --label-w-in: 4;
      --label-h-in: 6;
      --padding-in: 0.2;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      background:var(--bg);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      line-height:1.35;
    }

    .app{
      max-width:1100px;
      margin:0 auto;
      padding:16px;
      display:grid;
      gap:14px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px){
      .app{ grid-template-columns: 1.15fr 0.85fr; }
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
      min-width:0;
    }

    h1{
      font-size:16px;
      margin:0 0 10px 0;
      font-weight:650;
      letter-spacing:0.2px;
    }

    .row{ display:grid; gap:10px; margin-bottom:10px; }

    .row.controls{ grid-template-columns: 1fr; }
    @media (min-width: 520px){
      .row.controls{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (min-width: 900px){
      .row.controls{ grid-template-columns: repeat(3, minmax(0,1fr)); }
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }

    input[type="number"], select, textarea, button{
      width:100%;
      border-radius:10px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.04);
      color:var(--fg);
      padding:10px 10px;
      font-size:14px;
      outline:none;
    }

    /* Default textarea sizing (wide layouts) */
    textarea{
      min-height: 38vh;
      max-height: 60vh;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      line-height:1.25;
      white-space: pre;
    }
    @media (min-width: 900px){
      textarea{ min-height: 260px; }
    }

    /* Stacked mode: smaller default + auto-grow/shrink (JS sets height), no manual resize */
    @media (max-width: 899px){
      textarea{
        min-height: 120px;
        max-height: 55vh;
        resize: none;
      }
    }

    .hint{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    .btnrow{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:8px;
    }

    button{
      cursor:pointer;
      background: rgba(122,162,255,0.18);
      border-color: rgba(122,162,255,0.45);
      font-weight:650;
      padding: 12px 12px;
    }
    button:hover{ background: rgba(122,162,255,0.26); }
    button:active{ transform: translateY(1px); }

    .secondary{
      background: rgba(255,255,255,0.06);
      border-color: var(--border);
      font-weight:600;
    }

    .status{
      margin-left:auto;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }

    .previewOuter{
      display:grid;
      place-items:center;
      padding:12px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius:14px;
      overflow:auto;
    }

    /* Preview label */
    .label{
      background:#fff;
      color:#000;
      box-shadow:0 10px 26px rgba(0,0,0,0.35);
      position:relative;
      border-radius:12px;

      width: min(100%, calc(var(--label-w-in) * 96px));
      aspect-ratio: calc(var(--label-w-in) / var(--label-h-in));
      height: auto;
    }
    @media (min-width: 520px){
      .label{
        width: calc(var(--label-w-in) * 96px);
        height: calc(var(--label-h-in) * 96px);
        aspect-ratio: auto;
      }
    }

    .labelInner{
      position:absolute;
      inset: calc(var(--padding-in) * 96px);
      border:1px solid rgba(0,0,0,0.10);
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:0;
    }

    .labelTextSpan{
      display:inline-block;
      font-weight:800;
      line-height:1.05;
      white-space: pre;      /* preserve newlines */
      overflow-wrap: normal; /* no wrapping */
      word-break: keep-all;
      hyphens: none;
      text-align:center;
      font-size: 32px; /* JS overrides */
    }

    .warn{
      color:#ff6b6b;
      font-size:12px;
      margin-top:8px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="panel">
      <h1>Label Printer</h1>

      <div class="row controls">
        <div>
          <label for="w">Label width (in)</label>
          <input id="w" type="number" min="0.5" step="0.01" value="4" inputmode="decimal" />
        </div>
        <div>
          <label for="h">Label height (in)</label>
          <input id="h" type="number" min="0.5" step="0.01" value="6" inputmode="decimal" />
        </div>
        <div>
          <label for="pad">Padding (in)</label>
          <input id="pad" type="number" min="0" step="0.01" value="0.20" inputmode="decimal" />
        </div>
        <div>
          <label for="orient">Orientation</label>
          <select id="orient">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div>
          <label for="align">Text align</label>
          <select id="align">
            <option value="center" selected>Center</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="printBtn">Print</button>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="txt">Label text (newlines are respected; wrapping is disabled)</label>
          <textarea id="txt" spellcheck="false" placeholder="Type your label text here...">Hello
Rollo</textarea>

          <div class="hint">
            macOS Safari uses the print dialog’s Paper Size. If you see 8.5×11 in preview, set Paper Size to your label (or a Rollo label preset).
          </div>

          <div id="overflowWarn" class="warn" style="display:none;">
            This text can’t fit even at the minimum font size. Shorten a line or increase label size.
          </div>
        </div>
      </div>

      <div class="btnrow">
        <button id="resetBtn" class="secondary" type="button">Reset to 4×6</button>
        <div class="status" id="status">Ready</div>
      </div>
    </div>

    <div class="panel">
      <h1>Preview</h1>
      <div class="previewOuter">
        <div class="label" id="previewLabel">
          <div class="labelInner" id="previewInner">
            <span class="labelTextSpan" id="previewSpan"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const els = {
      w: document.getElementById('w'),
      h: document.getElementById('h'),
      pad: document.getElementById('pad'),
      orient: document.getElementById('orient'),
      align: document.getElementById('align'),
      txt: document.getElementById('txt'),

      previewInner: document.getElementById('previewInner'),
      previewSpan: document.getElementById('previewSpan'),

      printBtn: document.getElementById('printBtn'),
      resetBtn: document.getElementById('resetBtn'),
      status: document.getElementById('status'),
      overflowWarn: document.getElementById('overflowWarn')
    };

    function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
    function normalizeText(raw){ return (raw ?? '').replace(/\r\n/g, '\n'); }

    function isStackedMode(){
      return window.matchMedia('(max-width: 899px)').matches;
    }

    function autosizeTextarea(){
      if (!isStackedMode()){
        els.txt.style.height = '';
        els.txt.style.overflowY = '';
        return;
      }
      els.txt.style.height = 'auto';
      const maxPx = Math.floor(window.innerHeight * 0.55);
      const target = Math.min(els.txt.scrollHeight + 2, maxPx);
      els.txt.style.height = target + 'px';
      els.txt.style.overflowY = (els.txt.scrollHeight + 2 > maxPx) ? 'auto' : 'hidden';
    }

    function setCSSVars(labelW, labelH, padIn){
      document.documentElement.style.setProperty('--label-w-in', String(labelW));
      document.documentElement.style.setProperty('--label-h-in', String(labelH));
      document.documentElement.style.setProperty('--padding-in', String(padIn));
    }

    function applyAlignment(alignment){
      const a = alignment;
      els.previewSpan.style.textAlign = a;
      const justify = (a === 'left') ? 'flex-start' : (a === 'right') ? 'flex-end' : 'center';
      els.previewInner.style.justifyContent = justify;

      const inset = (a === 'center') ? '0' : '0.10in';
      els.previewInner.style.paddingLeft  = (a === 'left')  ? inset : '0';
      els.previewInner.style.paddingRight = (a === 'right') ? inset : '0';
    }

    function measureSpanFits(spanEl, containerEl, fontPx){
      spanEl.style.fontSize = fontPx + 'px';
      const s = spanEl.getBoundingClientRect();
      const c = containerEl.getBoundingClientRect();
      return (s.width <= c.width) && (s.height <= c.height);
    }

    function bestFitFontPx(spanEl, containerEl){
      const MIN_PX = 6;
      const MAX_PX = 1200;

      let lo = MIN_PX, hi = MAX_PX, best = MIN_PX;
      while (lo <= hi){
        const mid = (lo + hi) >> 1;
        if (measureSpanFits(spanEl, containerEl, mid)){
          best = mid; lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      spanEl.style.fontSize = best + 'px';
      const minFits = measureSpanFits(spanEl, containerEl, MIN_PX);
      spanEl.style.fontSize = best + 'px';
      return { fontPx: best, minFits };
    }

    function syncPreviewText(){
      const t = normalizeText(els.txt.value);
      els.previewSpan.textContent = t;
      return t;
    }

    function updateAll(){
      let w = parseFloat(els.w.value || '4');
      let h = parseFloat(els.h.value || '6');
      let pad = parseFloat(els.pad.value || '0.2');
      const orientation = els.orient.value;
      const align = els.align.value;

      w = clamp(isFinite(w) ? w : 4, 0.5, 20);
      h = clamp(isFinite(h) ? h : 6, 0.5, 30);
      pad = clamp(isFinite(pad) ? pad : 0.2, 0, Math.min(w,h)/2 - 0.01);

      const labelW = orientation === 'landscape' ? h : w;
      const labelH = orientation === 'landscape' ? w : h;

      setCSSVars(labelW, labelH, pad);
      applyAlignment(align);
      const t = syncPreviewText();

      const p = bestFitFontPx(els.previewSpan, els.previewInner);
      els.overflowWarn.style.display = p.minFits ? 'none' : 'block';
      els.status.textContent = p.minFits ? `Fit: ${Math.round(p.fontPx)}px` : `Text too large`;

      return { labelW, labelH, pad, align, text: t };
    }

    function escapeHtml(s){
      return s.replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    // Print using a dedicated, minimal document (most reliable on iOS + Safari)
    function openPrintWindow({ labelW, labelH, pad, align, text }){
      const safeText = escapeHtml(text).replace(/\n/g, "&#10;"); // preserve newlines

      const html = `<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Print Label</title>
<style>
  :root{
    --w: ${labelW};
    --h: ${labelH};
    --pad: ${pad};
  }
  @page { size: calc(var(--w) * 1in) calc(var(--h) * 1in); margin: 0; }
  html, body{
    margin:0; padding:0;
    width: calc(var(--w) * 1in);
    height: calc(var(--h) * 1in);
    overflow:hidden;
    background:#fff;
  }
  .label{
    width: 100%;
    height: 100%;
    display:flex;
    align-items:center;
    justify-content:${align === "left" ? "flex-start" : align === "right" ? "flex-end" : "center"};
    padding-left: ${align === "left" ? "0.10in" : "0"};
    padding-right:${align === "right" ? "0.10in" : "0"};
  }
  .inner{
    width: calc(100% - (var(--pad) * 2 * 1in));
    height: calc(100% - (var(--pad) * 2 * 1in));
    margin: calc(var(--pad) * 1in);
    display:flex;
    align-items:center;
    justify-content:inherit;
    overflow:hidden;
  }
  #span{
    display:inline-block;
    font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-weight: 800;
    line-height: 1.05;
    white-space: pre;
    overflow-wrap: normal;
    word-break: keep-all;
    hyphens:none;
    text-align:${align};
    font-size: 24pt; /* will be replaced */
  }
</style>
</head>
<body>
  <div class="label">
    <div class="inner" id="inner">
      <span id="span">${safeText}</span>
    </div>
  </div>

<script>
  function measureFits(pt){
    const span = document.getElementById('span');
    const inner = document.getElementById('inner');
    span.style.fontSize = pt + 'pt';
    const s = span.getBoundingClientRect();
    const c = inner.getBoundingClientRect();
    return (s.width <= c.width) && (s.height <= c.height);
  }

  function bestFitPt(){
    const MIN_PT = 4;    // safety floor
    const MAX_PT = 800;  // plenty
    let lo = MIN_PT, hi = MAX_PT, best = MIN_PT;

    while (lo <= hi){
      const mid = Math.floor((lo + hi) / 2);
      if (measureFits(mid)){ best = mid; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    document.getElementById('span').style.fontSize = best + 'pt';
    return best;
  }

  // Give layout a tick (iOS especially)
  requestAnimationFrame(() => {
    bestFitPt();
    setTimeout(() => { window.print(); }, 50);
  });
<\/script>
</body>
</html>`;

      const w = window.open("", "_blank");
      if (!w) {
        alert("Popup blocked. Allow popups for this site to print.");
        return;
      }
      w.document.open();
      w.document.write(html);
      w.document.close();
      w.focus();
    }

    async function printNow(){
      autosizeTextarea();
      const snapshot = updateAll();
      openPrintWindow(snapshot);
    }

    // Events
    [els.w, els.h, els.pad, els.orient, els.align].forEach(el => {
      el.addEventListener('input', () => { autosizeTextarea(); updateAll(); });
      el.addEventListener('change', () => { autosizeTextarea(); updateAll(); });
    });

    els.txt.addEventListener('input', () => {
      autosizeTextarea();
      updateAll();
    });

    window.addEventListener('resize', () => {
      clearTimeout(window.__labelResizeT);
      window.__labelResizeT = setTimeout(() => {
        autosizeTextarea();
        updateAll();
      }, 80);
    });

    els.printBtn.addEventListener('click', printNow);

    els.resetBtn.addEventListener('click', () => {
      els.w.value = '4';
      els.h.value = '6';
      els.pad.value = '0.20';
      els.orient.value = 'portrait';
      els.align.value = 'center';
      autosizeTextarea();
      updateAll();
    });

    // Init
    autosizeTextarea();
    updateAll();
  </script>
</body>
</html>
