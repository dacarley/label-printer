<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Label Print (Vanilla)</title>

  <style>
    :root{
      --bg:#0b0c10;
      --fg:#e8e8e8;
      --muted:#a7a7a7;
      --card:#14161d;
      --border:rgba(255,255,255,0.12);

      /* label settings (inches) */
      --label-w-in: 4;
      --label-h-in: 6;
      --padding-in: 0.2;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; 
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    
      background: var(--bg);
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    body{
      background:var(--bg);
      padding-bottom: env(safe-area-inset-bottom);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      line-height:1.35;
    }

    .app{
      max-width:1100px;
      margin:0 auto;
      padding:16px;
      display:grid;
      gap:14px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px){
      .app{ grid-template-columns: 1.15fr 0.85fr; }
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
      min-width:0;
    }

    h1{
      font-size:16px;
      margin:0 0 10px 0;
      font-weight:650;
      letter-spacing:0.2px;
    }

    .row{ display:grid; gap:10px; margin-bottom:10px; }

    .row.controls{ grid-template-columns: 1fr; }
    @media (min-width: 520px){
      .row.controls{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (min-width: 900px){
      .row.controls{ grid-template-columns: repeat(3, minmax(0,1fr)); }
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }

    input[type="number"], select, textarea, button{
      width:100%;
      border-radius:10px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.04);
      color:var(--fg);
      padding:10px 10px;
      font-size:14px;
      outline:none;
    }

    textarea{
      min-height: 38vh;
      max-height: 60vh;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      line-height:1.25;
      white-space: pre;
    
      font-size:16px;
    }
    @media (min-width: 900px){
      textarea{ min-height: 260px; }
    }
    @media (max-width: 899px){
      textarea{
        min-height: 120px;
        max-height: 55vh;
        resize: none;
      }
    }

    .hint{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    .btnrow{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:8px;
    }

    button{
      cursor:pointer;
      background: rgba(122,162,255,0.18);
      border-color: rgba(122,162,255,0.45);
      font-weight:650;
      padding: 12px 12px;
    }
    button:hover{ background: rgba(122,162,255,0.26); }
    button:active{ transform: translateY(1px); }

    .secondary{
      background: rgba(255,255,255,0.06);
      border-color: var(--border);
      font-weight:600;
    }

    .status{
      margin-left:auto;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }

    .previewOuter{
      display:grid;
      place-items:center;
      padding:12px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius:14px;
      overflow:auto;
    }

    /* Preview label (always portrait) */
    .label{
      background:#fff;
      color:#000;
      box-shadow:0 10px 26px rgba(0,0,0,0.35);
      position:relative;
      border-radius:12px;

      width: min(100%, calc(var(--label-w-in) * 96px));
      aspect-ratio: calc(var(--label-w-in) / var(--label-h-in));
      height: auto;
    }
    @media (min-width: 520px){
      .label{
        width: calc(var(--label-w-in) * 96px);
        height: calc(var(--label-h-in) * 96px);
        aspect-ratio: auto;
      }
    }

    .labelInner{
      position:absolute;
      inset: calc(var(--padding-in) * 96px);
      border:1px solid rgba(0,0,0,0.10);
      border-radius:10px;
      overflow:hidden;
      padding:0;
    }

    /* Preview rotator centers content; landscape rotates it */
    .previewRotator{
      position:absolute;
      left:50%;
      top:50%;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      transform-origin:center;
      transform: translate(-50%, -50%);
    }
    .previewRotator.landscape{
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .labelTextSpan{
      display:inline-block;
      font-weight:800;
      line-height:1.05;
      white-space: pre;
      overflow-wrap: normal;
      word-break: keep-all;
      hyphens: none;
      text-align:center;
      font-size: 32px; /* JS overrides */
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    .warn{
      color:#ff6b6b;
      font-size:12px;
      margin-top:8px;
    }

    /* ---- Print overlay ---- */
    #printOverlay{
      position:fixed;
      inset:0;
      background:#fff;
      display:none;
      z-index: 999999;
    }

    #printOverlay .printLabel{
      width: calc(var(--label-w-in) * 1in);
      height: calc(var(--label-h-in) * 1in);
      position:absolute;
      left:0;
      top:0;
      background:#fff;
      color:#000;
    }

    #printOverlay .printInner{
      position:absolute;
      inset: calc(var(--padding-in) * 1in);
      overflow:hidden;
      padding:0;
    }

    #printOverlay .rotator{
      position:absolute;
      left:50%;
      top:50%;
      transform-origin:center;
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      height:100%;
    }

    #printOverlay .rotator.portrait{
      transform: translate(-50%, -50%);
    }
    #printOverlay .rotator.landscape{
      transform: translate(-50%, -50%) rotate(90deg);
    }

    #printOverlay .printSpan{
      display:inline-block;
      font-weight:800;
      line-height:1.05;
      white-space: pre;
      overflow-wrap: normal;
      word-break: keep-all;
      hyphens:none;
      text-align:center;
      font-size: 24pt; /* JS overrides */
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    @page { size: auto; margin: 0; }

    /* Mirror print overlay styles for the persistent print root (iOS-friendly) */
    #printRoot .printLabel{
      width: calc(var(--label-w-in) * 1in);
      height: calc(var(--label-h-in) * 1in);
      position:absolute;
      left:0;
      top:0;
      background:#fff;
      color:#000;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    #printRoot .printInner{
      position:absolute;
      inset: calc(var(--padding-in) * 1in);
      overflow:hidden;
      padding:0;
    }

    #printRoot .rotator{
      position:absolute;
      left:50%;
      top:50%;
      transform-origin:center;
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      height:100%;
    }

    #printRoot .rotator.portrait{
      transform: translate(-50%, -50%);
    }
    #printRoot .rotator.landscape{
      transform: translate(-50%, -50%) rotate(90deg);
    }

    #printRoot .printSpan{
      display:inline-block;
      font-weight:800;
      line-height:1.05;
      white-space: pre;
      overflow-wrap: normal;
      word-break: keep-all;
      hyphens:none;
      text-align:center; /* JS may override via style */
      font-size: 24pt; /* JS will override */
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:#000 !important;
      -webkit-text-fill-color:#000; /* iOS/Safari sometimes uses this */
      text-rendering: geometricPrecision;
    }


    @media print{
      html,body{ margin:0 !important; padding:0 !important; background:#fff !important; }
      .app{ display:none !important; }
      #printOverlay{ display:block !important; }
    }
  
    /* Offscreen print root (kept "warm" for iOS printing) */
    #printRoot{
      position:fixed;
      left:-10000px;
      top:0;
      opacity:0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      pointer-events:none;
      z-index:-1;
    }
    #printRoot .printLabel{ position:relative; }

    @media print{
      /* Hide app UI in print */
      body > .wrap{ display:none !important; }
      #printOverlay{ display:none !important; } /* legacy */
      #printRoot{
        position:static !important;
        left:auto !important;
        top:auto !important;
        opacity:1 !important;
        pointer-events:auto !important;
        z-index:auto !important;
      }
      #printRoot[aria-hidden="true"]{ aria-hidden:false; }
    }

  
    @media print{ /* FORCE_PRINT_COLORS */
      html, body{
        background:#fff !important;
        color:#000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

  </style>
</head>

<body>
  <div class="app">
    <div class="panel">
      <h1>Label Printer</h1>

      <div class="row controls">
        <div>
          <label for="w">Label width (in)</label>
          <input id="w" type="number" min="0.5" step="0.01" value="4" inputmode="decimal" />
        </div>
        <div>
          <label for="h">Label height (in)</label>
          <input id="h" type="number" min="0.5" step="0.01" value="6" inputmode="decimal" />
        </div>
        <div>
          <label for="pad">Padding (in)</label>
          <input id="pad" type="number" min="0" step="0.01" value="0.20" inputmode="decimal" />
        </div>
        <div>
          <label for="orient">Orientation</label>
          <select id="orient">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape (rotate content)</option>
          </select>
        </div>
        <div>
          <label for="align">Text align</label>
          <select id="align">
            <option value="center" selected>Center</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="printBtn">Print</button>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="txt">Label text (newlines are respected; wrapping is disabled)</label>
          <textarea id="txt" spellcheck="false" placeholder="Type your label text here...">Hello
Rollo</textarea>

          <div class="hint">
            Preview always shows a portrait label; landscape rotates the text inside it (matches printing behavior).
          </div>

          <div id="overflowWarn" class="warn" style="display:none;">
            This text can’t fit even at the minimum font size. Shorten a line or increase label size.
          </div>
        </div>
      </div>

      <div class="btnrow">
        <button id="resetBtn" class="secondary" type="button">Reset to 4×6</button>
        <div class="status" id="status">Ready</div>
      </div>
    </div>

    <div class="panel">
      <h1>Preview</h1>
      <div class="previewOuter">
        <div class="label" id="previewLabel">
          <div class="labelInner" id="previewInner">
            <div class="previewRotator" id="previewRotator">
              <span class="labelTextSpan" id="previewSpan"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="printOverlay" aria-hidden="true"></div>
  <div id="printRoot" aria-hidden="true"></div>
<script>
    const els = {
      w: document.getElementById('w'),
      h: document.getElementById('h'),
      pad: document.getElementById('pad'),
      orient: document.getElementById('orient'),
      align: document.getElementById('align'),
      txt: document.getElementById('txt'),

      previewInner: document.getElementById('previewInner'),
      previewRotator: document.getElementById('previewRotator'),
      previewSpan: document.getElementById('previewSpan'),

      printBtn: document.getElementById('printBtn'),
      resetBtn: document.getElementById('resetBtn'),
      status: document.getElementById('status'),
      overflowWarn: document.getElementById('overflowWarn'),

      overlay: document.getElementById('printOverlay')
    };

    function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
    function normalizeText(raw){ return (raw ?? '').replace(/\r\n/g, '\n'); }

    function isStackedMode(){
      return window.matchMedia('(max-width: 899px)').matches;
    }

    function autosizeTextarea(){
      if (!isStackedMode()){
        els.txt.style.height = '';
        els.txt.style.overflowY = '';
        return;
      }
      els.txt.style.height = 'auto';
      const maxPx = Math.floor(window.innerHeight * 0.55);
      const target = Math.min(els.txt.scrollHeight + 2, maxPx);
      els.txt.style.height = target + 'px';
      els.txt.style.overflowY = (els.txt.scrollHeight + 2 > maxPx) ? 'auto' : 'hidden';
    }

    function setCSSVars(labelW, labelH, padIn){
      document.documentElement.style.setProperty('--label-w-in', String(labelW));
      document.documentElement.style.setProperty('--label-h-in', String(labelH));
      document.documentElement.style.setProperty('--padding-in', String(padIn));
    }

    function applyAlignment(alignment){
      const a = alignment;
      els.previewSpan.style.textAlign = a;

      els.previewRotator.style.justifyContent =
        (a === 'left') ? 'flex-start' : (a === 'right') ? 'flex-end' : 'center';

      els.previewRotator.style.paddingLeft  = (a === 'left')  ? '0.10in' : '0';
      els.previewRotator.style.paddingRight = (a === 'right') ? '0.10in' : '0';
    }

    function setPreviewRotation(orientation){
      els.previewRotator.classList.toggle('landscape', orientation === 'landscape');
    }

    // IMPORTANT:
    // When content is rotated with CSS transforms, getBoundingClientRect() already reflects that rotation.
    // So we fit by comparing spanRect directly to innerRect (no swapping).
    function measureSpanFitsPreviewPx(spanEl, innerEl, fontPx){
      spanEl.style.fontSize = fontPx + 'px';
      const s = spanEl.getBoundingClientRect();
      const c = innerEl.getBoundingClientRect();
      return (s.width <= c.width) && (s.height <= c.height);
    }

    function bestFitFontPreviewPx(spanEl, innerEl){
      const MIN_PX = 6;
      const MAX_PX = 1200;

      let lo = MIN_PX, hi = MAX_PX, best = MIN_PX;
      while (lo <= hi){
        const mid = (lo + hi) >> 1;
        if (measureSpanFitsPreviewPx(spanEl, innerEl, mid)){
          best = mid; lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      spanEl.style.fontSize = best + 'px';
      const minFits = measureSpanFitsPreviewPx(spanEl, innerEl, MIN_PX);
      spanEl.style.fontSize = best + 'px';
      return { fontPx: best, minFits };
    }

    // --- PT fitter for print overlay (same direct-rect logic; rotation is already baked into DOMRects) ---
    function measureSpanFitsPt(spanEl, innerEl, fontPt){
      spanEl.style.fontSize = fontPt + 'pt';
      const s = spanEl.getBoundingClientRect();
      const c = innerEl.getBoundingClientRect();
      return (s.width <= c.width) && (s.height <= c.height);
    }

    function bestFitFontPt(spanEl, innerEl){
      const MIN_PT = 4;
      const MAX_PT = 800;

      let lo = MIN_PT, hi = MAX_PT, best = MIN_PT;
      while (lo <= hi){
        const mid = Math.floor((lo + hi) / 2);
        if (measureSpanFitsPt(spanEl, innerEl, mid)){
          best = mid; lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      spanEl.style.fontSize = best + 'pt';
      const minFits = measureSpanFitsPt(spanEl, innerEl, MIN_PT);
      spanEl.style.fontSize = best + 'pt';
      return { fontPt: best, minFits };
    }

    function syncPreviewText(){
      const t = normalizeText(els.txt.value);
      els.previewSpan.textContent = t;
      return t;
    }

    function updateAll(){
      let w = parseFloat(els.w.value || '4');
      let h = parseFloat(els.h.value || '6');
      let pad = parseFloat(els.pad.value || '0.2');
      const align = els.align.value;
      const orientation = els.orient.value;

      w = clamp(isFinite(w) ? w : 4, 0.5, 20);
      h = clamp(isFinite(h) ? h : 6, 0.5, 30);
      pad = clamp(isFinite(pad) ? pad : 0.2, 0, Math.min(w,h)/2 - 0.01);

      // Page stays portrait; landscape rotates content.
      const labelW = w;
      const labelH = h;

      setCSSVars(labelW, labelH, pad);
      applyAlignment(align);
      setPreviewRotation(orientation);

      const text = syncPreviewText();

      const p = bestFitFontPreviewPx(els.previewSpan, els.previewInner);

      els.overflowWarn.style.display = p.minFits ? 'none' : 'block';
      els.status.textContent = p.minFits ? `Fit: ${Math.round(p.fontPx)}px` : `Text too large`;

      const snapshot = { labelW, labelH, pad, align, text, orientation };
      // Keep the print iframe "warm" so iOS can print within the user gesture.
      try { renderPrintRoot(snapshot); } catch(e) {}
      return snapshot;
    }

    function buildPrintOverlay({ labelW, labelH, pad, align, text, orientation }){
      setCSSVars(labelW, labelH, pad);

      els.overlay.innerHTML = "";
      els.overlay.style.display = "block";
      els.overlay.setAttribute("aria-hidden", "false");

      const label = document.createElement("div");
      label.className = "printLabel";

      const inner = document.createElement("div");
      inner.className = "printInner";

      const rotator = document.createElement("div");
      rotator.className = "rotator " + (orientation === "landscape" ? "landscape" : "portrait");

      const span = document.createElement("span");
      span.className = "printSpan";
      span.textContent = text;

      span.style.textAlign = align;
      rotator.style.justifyContent =
        (align === "left") ? "flex-start" :
        (align === "right") ? "flex-end" : "center";

      rotator.style.paddingLeft  = (align === "left")  ? "0.10in" : "0";
      rotator.style.paddingRight = (align === "right") ? "0.10in" : "0";

      rotator.appendChild(span);
      inner.appendChild(rotator);
      label.appendChild(inner);
      els.overlay.appendChild(label);

      return { inner, span };
    }

    function teardownPrintOverlay(){
      els.overlay.style.display = "none";
      els.overlay.setAttribute("aria-hidden", "true");
      els.overlay.innerHTML = "";
    }

    let __printing = false;
    function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
    function nextFrame(){ return new Promise(r => requestAnimationFrame(() => r())); }
    const printRoot = document.getElementById('printRoot');

    function renderPrintRoot({ labelW, labelH, pad, align, text, orientation }){
      // Keep the printable DOM in the main document so iOS Safari can reliably print it
      // within the user gesture (no async needed).
      printRoot.innerHTML = "";
      printRoot.setAttribute("aria-hidden", "true");

      const label = document.createElement("div");
      label.className = "printLabel";
      // Size in inches using CSS vars already set via setCSSVars()
      // but also set explicit size so it lays out offscreen consistently.
      label.style.width = `calc(${labelW} * 1in)`;
      label.style.height = `calc(${labelH} * 1in)`;

      const inner = document.createElement("div");
      inner.className = "printInner";

      const rotator = document.createElement("div");
      rotator.className = "rotator " + (orientation === "landscape" ? "landscape" : "portrait");

      const span = document.createElement("span");
      span.className = "printSpan";
      span.textContent = text;

      span.style.textAlign = align;
      rotator.style.justifyContent =
        (align === "left") ? "flex-start" :
        (align === "right") ? "flex-end" : "center";

      rotator.style.paddingLeft  = (align === "left")  ? "0.10in" : "0";
      rotator.style.paddingRight = (align === "right") ? "0.10in" : "0";

      rotator.appendChild(span);
      inner.appendChild(rotator);
      label.appendChild(inner);
      printRoot.appendChild(label);

      // Force layout synchronously and size text for print container
      void inner.offsetHeight;
      bestFitFontPt(span, inner);
      void inner.offsetHeight;

      // Set a size so WebKit doesn't treat it as non-renderable
      printRoot.style.width = `calc(${labelW} * 1in)`;
      printRoot.style.height = `calc(${labelH} * 1in)`;

      return { inner, span };
    }

    function printNow(){
      if (__printing) return;
      __printing = true;

      autosizeTextarea();
      const snapshot = updateAll(); // updateAll will call renderPrintRoot(snapshot)

      // Safety: ensure print DOM is ready (sync)
      try { renderPrintRoot(snapshot); } catch(e) {}

      // Print synchronously inside the user gesture (important for iOS Safari)
      
      // iOS Safari: avoid zoom/resize weirdness caused by focused inputs during print
      try { document.activeElement && document.activeElement.blur && document.activeElement.blur(); } catch(e) {}
      try { els.txt && els.txt.blur && els.txt.blur(); } catch(e) {}

      // Preserve scroll position (print UI can cause a jump)
      const __sx = window.scrollX, __sy = window.scrollY;
      window.print();
      setTimeout(() => window.scrollTo(__sx, __sy), 0);

      // iOS afterprint is unreliable; reset gate after a short delay.
      setTimeout(() => { __printing = false; }, 800);
    }

    // Events
    [els.w, els.h, els.pad, els.orient, els.align].forEach(el => {
      el.addEventListener('input', () => { autosizeTextarea(); updateAll(); });
      el.addEventListener('change', () => { autosizeTextarea(); updateAll(); });
    });

    els.txt.addEventListener('input', () => {
      autosizeTextarea();
      updateAll();
    });

    window.addEventListener('resize', () => {
      clearTimeout(window.__labelResizeT);
      window.__labelResizeT = setTimeout(() => {
        autosizeTextarea();
        updateAll();
      }, 80);
    });

    els.printBtn.addEventListener('click', printNow);

    els.resetBtn.addEventListener('click', () => {
      els.w.value = '4';
      els.h.value = '6';
      els.pad.value = '0.20';
      els.orient.value = 'portrait';
      els.align.value = 'center';
      autosizeTextarea();
      updateAll();
    });

    // Init
    autosizeTextarea();
    updateAll();
  </script>
</body>
</html>
